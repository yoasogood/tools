<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>庄稼狼｜LINE 會員綁定</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{--purple:#413140;--gold:#B0814A;--olive:#6B7A3A;--cream:#F6F0E2;--paper:#FFFDF8;--grey:#6E6270;--red:#B23A2E}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--purple);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;line-height:1.7}
  main{max-width:460px;margin:0 auto;padding:28px 18px 40px}
  .card{background:var(--paper);border-radius:14px;padding:26px 22px;box-shadow:0 2px 10px rgba(65,49,64,.08)}
  .logo{display:block;width:180px;margin:0 auto 14px}
  h1{font-size:22px;text-align:center;margin:0 0 8px;letter-spacing:2px}
  .lead{font-size:15px;color:var(--grey);margin:0 0 20px}
  label{display:block;font-weight:bold;font-size:15px;margin-bottom:16px}
  label span{color:var(--red)}
  input[type=tel],input[type=text]{display:block;width:100%;margin-top:6px;padding:12px 14px;font-size:17px;border:1.5px solid #D9CFC0;border-radius:10px;background:#fff;color:var(--purple)}
  input:focus{outline:none;border-color:var(--purple)}
  .chk{display:flex;gap:10px;align-items:flex-start;font-weight:normal;font-size:14px;color:var(--grey)}
  .chk span{color:var(--grey)}
  .chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--purple)}
  button{display:block;width:100%;padding:14px;font-size:17px;font-weight:bold;color:#fff;background:var(--purple);border:0;border-radius:28px;cursor:pointer}
  button:disabled{opacity:.5}
  .msg{min-height:1.6em;margin:12px 0 0;font-size:14px;text-align:center;color:var(--red)}
  .done{text-align:center}
  .done .wolf{display:block;width:96px;margin:6px auto 4px}
  .done p{color:var(--grey)}
  .done button{background:var(--olive);margin-top:18px}
  .status{text-align:center;color:var(--grey)}
  footer{text-align:center;font-size:12px;color:#9A8E98;margin-top:18px}
</style>
</head>
<body>
<main>
  <div class="card">
    <img class="logo" src="../assets/logo.png" alt="庄稼狼">
    <h1>LINE 會員綁定</h1>
    <p class="lead">填上您官網訂購時的電話，之後的老狼客優惠、早鳥通知，都會優先傳到您的Line，不用再找連結囉！</p>

    <p id="status" class="status">載入中…</p>

    <form id="form" hidden novalidate>
      <label>訂購電話 <span>*</span>
        <input id="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="例如 0912345678" maxlength="15">
      </label>
      <label>訂購人姓名（選填）
        <input id="name" type="text" maxlength="20" autocomplete="name" placeholder="方便我們對照訂單">
      </label>
      <label class="chk">
        <input id="agree" type="checkbox">
        <span>我同意庄稼狼用這支電話對照我的訂購紀錄、傳送優惠與出貨通知，不做其他用途。</span>
      </label>
      <button id="submit" type="submit">送出綁定</button>
      <p id="msg" class="msg" role="status"></p>
    </form>

    <div id="done" class="done" hidden>
      <img class="wolf" src="../assets/wolf.png" alt="庄稼狼">
      <h1>綁定完成</h1>
      <button id="close" type="button">回到對話</button>
    </div>
  </div>
  <footer>庄稼狼農產｜台南麻豆</footer>
</main>

<script>
  // 這兩個值都不是密碼，放在公開網頁上沒有安全疑慮
  const LIFF_ID = "2012687347-qRK59bry";
  const API_URL = "https://script.google.com/macros/s/AKfycbzxUK2cqFaRCU4r_-_dlRz97OswA2JE3Ei0nMWdWnqjN5_L0CiR6bwK8ppF_65SsMxN/exec";

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const source = (params.get("src") || "direct").replace(/[^\w-]/g, "").slice(0, 30);
  const preview = params.get("preview") === "1";

  const normPhone = (v) => v.replace(/[^\d]/g, "");
  const validPhone = (p) => /^09\d{8}$/.test(p) || /^0[2-8]\d{7,8}$/.test(p);
  const say = (t) => { $("msg").textContent = t; };

  async function start() {
    if (preview) { $("status").hidden = true; $("form").hidden = false; return; }
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      $("status").hidden = true;
      $("form").hidden = false;
    } catch (e) {
      $("status").textContent = "頁面載入失敗，請從庄稼狼的 LINE 官方帳號重新開啟。";
    }
  }

  $("form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const phone = normPhone($("phone").value);
    if (!validPhone(phone)) { say("電話格式好像不對，請再確認一次（例如 0912345678）"); return; }
    if (!$("agree").checked) { say("請先勾選同意，才能完成綁定"); return; }
    if (preview) { $("form").hidden = true; $("done").hidden = false; return; }

    $("submit").disabled = true;
    say("送出中…");
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          idToken: liff.getIDToken(),
          phone,
          name: $("name").value.trim().slice(0, 20),
          source
        })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "failed");

      // 在聊天室留下一句紀錄，方便一對一聊天時辨識客人
      if (liff.isInClient()) {
        try { await liff.sendMessages([{ type: "text", text: "會員綁定完成（末四碼 " + phone.slice(-4) + "）" }]); } catch (e) {}
      }
      $("form").hidden = true;
      $("done").hidden = false;
    } catch (e) {
      say("送出失敗，請稍後再試，或直接在聊天室留言給我們。");
      $("submit").disabled = false;
    }
  });

  $("close").addEventListener("click", () => {
    if (!preview && liff.isInClient()) liff.closeWindow(); else history.back();
  });

  start();
</script>
</body>
</html>
